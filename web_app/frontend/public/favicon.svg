<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Datice">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7b23a" />
      <stop offset="1" stop-color="#f4726b" />
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4dc" />
      <stop offset="1" stop-color="#ffe6b8" />
    </radialGradient>
  </defs>
  <!-- warm brand tile -->
  <rect width="32" height="32" rx="8" fill="url(#tile)" />
  <!-- dermatoscope ring -->
  <circle cx="16" cy="16" r="9" fill="none" stroke="#fff6ea" stroke-width="2.3" opacity="0.95" />
  <!-- luminous core -->
  <circle cx="16" cy="16" r="4.4" fill="url(#core)" />
</svg>
