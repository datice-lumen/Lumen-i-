[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen"
version = "0.1.0"
description = "Fairness-driven melanoma classification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.21",
    "opencv-python>=4.5",
    "Pillow>=8.0",
    "pandas>=1.3",
    "scikit-learn>=1.0",
    "scikit-image>=0.18",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "tqdm",
    "gdown",
    "ultralytics>=8.3",
]

[project.optional-dependencies]
web = ["fastapi", "uvicorn", "python-multipart", "pydantic"]
dev = ["ipykernel", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
